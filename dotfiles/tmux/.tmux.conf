# .tmux.conf — sane defaults for long recon/CTF sessions

# use Ctrl-a as prefix (easier reach than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# mouse support (scroll, select panes, resize)
set -g mouse on

# start numbering windows/panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# large scrollback — useful when a scan dumps a lot of output
set -g history-limit 50000

# faster escape time (helps vim inside tmux)
set -sg escape-time 10

# split panes with more intuitive keys, keeping current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# status bar
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"
set -g status-interval 5

# highlight active window
setw -g window-status-current-style fg=black,bg=green,bold
